[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falcons-falcons-intelligence"
version = "2.0.0"
description = "Rheinland Falcons Basketball Intelligence Platform (JBBL U16) — Analytical, Tactical, and Scouting Operating System"
authors = [{ name = "Basketball Analytics Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
falcons-ingest = "python.operations.incremental_ingestion:main_cli"
falcons-registry = "python.operations.game_registry:build_game_registry"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
