# ==============================================================================
# RHEINLAND FALCONS BASKETBALL — DOCKER COMPOSE
# ==============================================================================
# Usage:
#   docker compose up --build        # build & start
#   docker compose up -d             # detached
#   docker compose down              # stop & remove
# ==============================================================================

services:
  falcons-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: rheinland-falcons-demo:latest
    container_name: rheinland_falcons_demo
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    environment:
      - DEMO_AUTH_PASSWORD=${DEMO_AUTH_PASSWORD:-demotool}
      - PORT=10000
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:10000/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
